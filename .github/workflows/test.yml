on:
  push:
    branches:
      - main
  pull_request:

name: Cargo Test

jobs:
  test:
    name: Cargo Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
      # The static OpenCASCADE build (from the `occt-sys` crate) takes the bulk of the build time.
      - name: Cache OpenCASCADE
        uses: actions/cache@v4
        with:
          path: target/OCCT
          key: occt-7.8.1-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
      - run: cargo test --workspace --all-targets
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Coverage reuses the OpenCASCADE installation built above instead of building it again
      # in llvm-cov's separate target directory.
      - name: Coverage
        env:
          DEP_OCCT_ROOT: ${{ github.workspace }}/target/OCCT
        run: >
          cargo llvm-cov --no-default-features -p opencascade-rhai -p opencascade-sys
          --summary-only --show-missing-lines --fail-under-lines 95
