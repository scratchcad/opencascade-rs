# Modified by Joaquim Dalton-Pereira, 2026-10-13. Based on opencascade-rs
# (https://github.com/bschwind/opencascade-rs); later changes are in the git history.

on:
  push:
    branches:
      - main
  pull_request:

name: Cargo Test

permissions:
  contents: read

jobs:
  test:
    name: Cargo Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
      # The prebuilt OpenCASCADE from conda-forge, which the crates link by default.
      - uses: ./.github/actions/install-occt
      - run: cargo test --workspace --all-targets
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: >
          cargo llvm-cov -p scratchcad-occt-rhai -p scratchcad-occt-sys
          --summary-only --show-missing-lines --fail-under-lines 95
