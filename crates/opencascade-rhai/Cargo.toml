[package]
name = "opencascade-rhai"
description = "Script the OpenCASCADE CAD kernel with Rhai"
license = "LGPL-2.1"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1"
glam = "0.30"
opencascade-sys = { version = "0.4", path = "../opencascade-sys" }
rhai = "1.26"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["builtin"]
# Build OpenCASCADE from source (via `occt-sys`) instead of using a system installation.
builtin = ["opencascade-sys/builtin"]
