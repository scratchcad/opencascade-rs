[package]
name = "scratchcad-occt-rhai"
description = "Script the OpenCASCADE CAD kernel with Rhai"
license = "LGPL-2.1-only"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/scratchcad/scratchcad-occt-rs"
readme = "../../README.md"
keywords = ["cad", "opencascade", "rhai", "scripting", "step"]
categories = ["graphics", "science", "command-line-utilities"]

[dependencies]
cxx = "1"
glam = "0.34"
scratchcad-occt-sys = { version = "0.1", path = "../scratchcad-occt-sys" }
rhai = "1.26"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["builtin"]
# Build OpenCASCADE from source (via `occt-sys`) instead of using a system installation.
builtin = ["scratchcad-occt-sys/builtin"]
