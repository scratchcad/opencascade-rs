[package]
name = "opencascade-sys"
description = "Rust bindings to the OpenCascade CAD Kernel (fork with C++ exception handling)"
authors = ["Brian Schwind <brianmschwind@gmail.com>"]
license = "LGPL-2.1"
version = "0.4.0"
edition = "2021"
repository = "https://github.com/bschwind/opencascade-rs"
readme = "README.md"

[dependencies]
cxx = "1"

[build-dependencies]
cmake = "0.1"
cxx-build = "1"
occt-sys = { version = "=7.8.1", optional = true }

[features]
builtin = ["occt-sys"]
